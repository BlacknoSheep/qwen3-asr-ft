[project]
name = "qwen3-asr-ft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "librosa>=1.0.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "peft>=0.21.2",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.17.0",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

vllm = [
    "vllm[audio]>=0.30.0",
]
